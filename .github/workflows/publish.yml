name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read   # checkout private repo
      id-token: write  # trusted publishing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.2.2
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f  # v4
      - name: Build
        run: uv build
      - name: Publish to PyPI
        # release/v1 @ v1.14.2 (2026-07-29). The 2025-09 pin bundled a twine that
        # rejects Metadata-Version 2.5, which uv's build backend now emits — the
        # v0.4.31.2 publish failed on exactly that check.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
